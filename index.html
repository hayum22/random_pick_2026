<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抽選会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1E2A52;
    --night-deep: #141C3A;
    --moon: #FFD45C;
    --moon-soft: #FFE9A8;
    --paper: #FFFFFF;
    --mist: #AEB8D6;
    --line: #3A4A7E;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(circle at 30% 45%, var(--night) 0%, var(--night-deep) 70%);
    color: var(--paper);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 500;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 2.5vh 3vw;
    gap: 2vh;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 4vh; margin: 0; font-weight: 700; }
  .count { font-size: 3vh; color: var(--mist); }
  .count strong { color: var(--paper); font-size: 4.5vh; }

  main {
    display: grid;
    grid-template-columns: minmax(18vw, 24vw) 1fr;
    gap: 3vw;
    min-height: 0;
  }
  .left {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.5vh;
  }
  .stage {
    width: min(62vh, 46vw); aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, var(--moon-soft) 0%, var(--moon) 55%, #E9B634 100%);
    display: grid; place-items: center;
    box-shadow: 0 0 10vh rgba(255, 212, 92, .35);
  }
  .number {
    font-family: "Dela Gothic One", "Zen Maru Gothic", sans-serif;
    font-size: min(26vh, 19vw);
    line-height: 1; color: var(--night-deep);
    font-variant-numeric: tabular-nums;
  }
  .number.idle { font-size: min(8vh, 6vw); }
  .stage.rolling .number { opacity: .55; }
  .stage.hit { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }

  .draw {
    font: inherit; font-weight: 700; font-size: 4vh;
    padding: 1.8vh 7vh; border-radius: 999px; border: 3px solid var(--moon);
    background: var(--moon); color: var(--night-deep); cursor: pointer;
  }
  .draw:hover { background: var(--moon-soft); }
  .draw:disabled { background: transparent; color: var(--mist); border-color: var(--line); cursor: not-allowed; }

  section.history {
    display: flex; flex-direction: column; min-height: 0;
    border-right: 2px solid var(--line); padding-right: 2vw;
  }
  .history h2 { font-size: 2.6vh; color: var(--mist); margin: 0 0 1.5vh; font-weight: 500; }
  .table-wrap { overflow-y: auto; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  thead th {
    position: sticky; top: 0; background: var(--night-deep);
    font-size: 2.2vh; font-weight: 500; color: var(--mist);
    padding: .8vh 1vh; border-bottom: 2px solid var(--line);
  }
  tbody td { padding: .7vh 1vh; border-bottom: 1px solid var(--line); text-align: center; }
  td.order { font-size: 2.4vh; color: var(--mist); }
  td.num { font-size: 3.6vh; font-weight: 700; }
  tbody tr.latest td.num { color: var(--moon); }
  tbody tr.latest { background: rgba(255, 212, 92, .1); }
  td.empty { color: var(--mist); font-size: 2.4vh; padding: 2vh 0; }

  footer { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: flex-end; align-items: center; }
  .hint { color: var(--mist); font-size: 2vh; margin: 0 auto 0 0; }
  .sub {
    font: inherit; font-size: 2vh; padding: .8vh 1.6vh; border-radius: 8px;
    background: transparent; color: var(--paper); border: 2px solid var(--line); cursor: pointer;
  }
  .sub:hover { border-color: var(--mist); }
  .sub[aria-pressed="true"] { border-color: var(--moon); color: var(--moon); }
  .sub.danger:hover { border-color: #FF8A8A; color: #FF8A8A; }
  button:focus-visible { outline: 4px solid var(--paper); outline-offset: 4px; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 縦長の画面（スマホ等）では縦並びに */
  @media (max-aspect-ratio: 1/1) {
    html, body { overflow: auto; height: auto; }
    body { min-height: 100%; }
    main { grid-template-columns: 1fr; }
    .stage { width: min(80vw, 60vh); }
    .number { font-size: 24vw; }
    section.history { border-right: none; padding-right: 0; order: 2; }
    .table-wrap { max-height: 50vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage.hit { animation: none; }
  }
</style>
</head>
<body>
<header>
  <h1>抽選会</h1>
  <div class="count">残り <strong id="remain">410</strong> / <span id="total">410</span></div>
</header>

<main>
  <section class="history" aria-labelledby="histTitle">
    <h2 id="histTitle">これまでに出た番号</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">回</th><th scope="col">番号</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <div class="left">
    <div class="stage" id="stage">
      <div class="number idle" id="number" aria-hidden="true">スタート</div>
    </div>
    <button class="draw" id="drawBtn">抽選する</button>
  </div>
  <p class="sr-only" id="announce" aria-live="assertive"></p>
</main>

<footer>
  <p class="hint">スペースキーかEnterキーでも引けます</p>
  <button class="sub" id="voiceBtn" aria-pressed="true">読み上げあり</button>
  <button class="sub" id="soundBtn" aria-pressed="true">効果音あり</button>
  <button class="sub" id="animBtn" aria-pressed="true">演出あり</button>
  <button class="sub" id="fsBtn">全画面</button>
  <button class="sub" id="undoBtn">最後の1件を取り消す</button>
  <button class="sub danger" id="resetBtn">最初からやり直す</button>
</footer>

<script>
  // ===== 設定 =====
  const MIN = 1;
  const MAX = 410;
  const ROLL_MS = 2600; // 演出の長さ（ミリ秒）
  // ================

  const STORE_KEY = `lottery-${MIN}-${MAX}`;
  const total = MAX - MIN + 1;
  let drawn = [];
  let rolling = false;
  let animate = true;
  let sound = true;
  const VOLUME = 0.5; // 効果音の音量（0〜1）
  let voiceOn = true;
  const SPEAK_TEXT = n => `${n}番。${n}番です。`; // 読み上げる文
  const SPEAK_DELAY = 1200; // 当選音から読み上げまでの間（ミリ秒）
  const SPEAK_RATE = 0.9;   // 読む速さ（1が標準）

  const $ = id => document.getElementById(id);
  const numEl = $("number"), stage = $("stage"), drawBtn = $("drawBtn");

  // ===== 効果音（音声ファイル不要） =====
  let audioCtx = null;
  function ctx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, type = "triangle", vol = 1) {
    const c = ctx(); if (!c) return;
    const t = c.currentTime + start;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(VOLUME * vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  // ホワイトノイズ（スネアやシンバル用）
  let noiseBuf = null;
  function noise() {
    const c = ctx(); if (!c) return null;
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = c.createBufferSource();
    src.buffer = noiseBuf;
    return src;
  }
  // スネア1打（柔らかめ）
  function snare(at, vol) {
    const c = ctx(); if (!c) return;
    const src = noise(); if (!src) return;
    const bp = c.createBiquadFilter(), lp = c.createBiquadFilter(), gain = c.createGain();
    bp.type = "bandpass"; bp.frequency.value = 1500; bp.Q.value = 0.5;
    lp.type = "lowpass"; lp.frequency.value = 5000;
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.linearRampToValueAtTime(VOLUME * vol, at + 0.004); // 立ち上がりを少しなめらかに
    gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);   // 余韻を長めに
    src.connect(bp).connect(lp).connect(gain).connect(c.destination);
    src.start(at, Math.random()); src.stop(at + 0.17);
    // 太鼓の胴鳴り
    const osc = c.createOscillator(), og = c.createGain();
    osc.type = "sine"; osc.frequency.value = 190;
    og.gain.setValueAtTime(VOLUME * vol * 0.35, at);
    og.gain.exponentialRampToValueAtTime(0.0001, at + 0.07);
    osc.connect(og).connect(c.destination);
    osc.start(at); osc.stop(at + 0.08);
  }
  // ドラムロール（だんだん大きく）
  function drumroll(sec) {
    if (!sound) return;
    const c = ctx(); if (!c) return;
    const t0 = c.currentTime + 0.02;
    const step = 0.03;
    for (let t = 0; t < sec; t += step) {
      const p = t / sec;
      const jitter = (Math.random() - 0.5) * 0.006;
      const accent = Math.round(t / step) % 2 ? 0.88 : 1;
      snare(t0 + t + jitter, (0.12 + 0.38 * p * p) * accent);
    }
    // 打音の隙間を埋める「ザー」という響き
    const src = noise(); if (!src) return;
    const bp = c.createBiquadFilter(), g = c.createGain();
    bp.type = "bandpass"; bp.frequency.value = 1300; bp.Q.value = 0.6;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(VOLUME * 0.05, t0 + 0.2);
    g.gain.linearRampToValueAtTime(VOLUME * 0.16, t0 + sec);
    g.gain.linearRampToValueAtTime(0.0001, t0 + sec + 0.05);
    src.loop = true;
    src.connect(bp).connect(g).connect(c.destination);
    src.start(t0); src.stop(t0 + sec + 0.1);
  }
  // 「ジャーン！」（シンバル＋バスドラム）
  function crash() {
    const c = ctx(); if (!c) return;
    const t = c.currentTime;
    const src = noise();
    if (src) {
      const hp = c.createBiquadFilter(), g = c.createGain();
      hp.type = "highpass"; hp.frequency.value = 5000;
      g.gain.setValueAtTime(VOLUME * 0.7, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      src.connect(hp).connect(g).connect(c.destination);
      src.start(t); src.stop(t + 1.9);
    }
    const osc = c.createOscillator(), kg = c.createGain();
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.3);
    kg.gain.setValueAtTime(VOLUME * 1.2, t);
    kg.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    osc.connect(kg).connect(c.destination);
    osc.start(t); osc.stop(t + 0.45);
  }
  // 当選時の音
  function fanfare() {
    if (!sound) return;
    crash();
    const n = [523.25, 659.25, 783.99, 1046.5]; // ド ミ ソ ド
    n.forEach((f, i) => tone(f, i * 0.09, 0.25, "triangle", 0.6));
    [523.25, 659.25, 783.99, 1046.5].forEach(f => tone(f, 0.38, 1.1, "triangle", 0.45));
    tone(2093, 0.38, 0.6, "sine", 0.2); // キラッ
  }
  // =====================================

  // ===== 読み上げ（Web Speech API） =====
  const canSpeak = "speechSynthesis" in window;
  let jaVoice = null, speakTimer = null;
  function pickVoice() {
    if (!canSpeak) return;
    const vs = speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").startsWith("ja"));
    const prefer = ["Google", "Nanami", "Keita", "Kyoko", "Microsoft"];
    jaVoice = prefer.map(k => vs.find(v => v.name.includes(k))).find(Boolean) || vs[0] || null;
  }
  if (canSpeak) { pickVoice(); speechSynthesis.addEventListener?.("voiceschanged", pickVoice); }
  function stopSpeak() {
    clearTimeout(speakTimer);
    if (canSpeak) speechSynthesis.cancel();
  }
  function speak(text, delay = 0) {
    if (!voiceOn || !canSpeak) return;
    stopSpeak();
    speakTimer = setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      if (jaVoice) u.voice = jaVoice;
      u.rate = SPEAK_RATE;
      speechSynthesis.speak(u);
    }, delay);
  }
  // =====================================

  // 偏りのない乱数（crypto + 棄却サンプリング）
  function randInt(n) {
    const limit = Math.floor(0x100000000 / n) * n;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }

  function remaining() {
    const used = new Set(drawn);
    const pool = [];
    for (let i = MIN; i <= MAX; i++) if (!used.has(i)) pool.push(i);
    return pool;
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ drawn, animate, sound, voiceOn })); } catch (e) {}
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY));
      if (d && Array.isArray(d.drawn)) {
        drawn = d.drawn.filter(n => Number.isInteger(n) && n >= MIN && n <= MAX);
        drawn = [...new Set(drawn)];
      }
      if (d && typeof d.animate === "boolean") animate = d.animate;
      if (d && typeof d.sound === "boolean") sound = d.sound;
      if (d && typeof d.voiceOn === "boolean") voiceOn = d.voiceOn;
    } catch (e) {}
  }

  function render() {
    $("total").textContent = total;
    $("remain").textContent = total - drawn.length;
    const rows = $("rows");
    rows.innerHTML = "";
    if (drawn.length === 0) {
      rows.innerHTML = '<tr><td class="empty" colspan="2">まだありません</td></tr>';
    } else {
      for (let i = 0; i < drawn.length; i++) {
        const tr = document.createElement("tr");
        if (i === drawn.length - 1) tr.className = "latest";
        tr.innerHTML = `<td class="order">${i + 1}</td><td class="num">${drawn[i]}</td>`;
        rows.appendChild(tr);
      }
      const wrap = rows.closest(".table-wrap");
      wrap.scrollTop = wrap.scrollHeight; // 最新の行が見えるように
    }
    const done = drawn.length >= total;
    drawBtn.disabled = done || rolling;
    drawBtn.textContent = done ? "すべて出ました" : "抽選する";
    $("undoBtn").disabled = drawn.length === 0 || rolling;
    $("voiceBtn").setAttribute("aria-pressed", voiceOn && canSpeak);
    $("voiceBtn").textContent = !canSpeak ? "読み上げ非対応" : voiceOn ? "読み上げあり" : "読み上げなし";
    $("voiceBtn").disabled = !canSpeak;
    $("soundBtn").setAttribute("aria-pressed", sound);
    $("soundBtn").textContent = sound ? "効果音あり" : "効果音なし";
    $("animBtn").setAttribute("aria-pressed", animate);
    $("animBtn").textContent = animate ? "演出あり" : "演出なし";
  }

  function showNumber(n, idle = false) {
    numEl.textContent = n;
    numEl.classList.toggle("idle", idle);
  }

  function finish(result) {
    drawn.push(result);
    save();
    rolling = false;
    stage.classList.remove("rolling");
    showNumber(result);
    stage.classList.remove("hit"); void stage.offsetWidth; stage.classList.add("hit");
    $("announce").textContent = `${result}番`;
    fanfare();
    speak(SPEAK_TEXT(result), sound ? SPEAK_DELAY : 0);
    render();
  }

  function draw() {
    if (rolling) return;
    const pool = remaining();
    if (pool.length === 0) return;
    const result = pool[randInt(pool.length)];
    $("announce").textContent = "";
    stopSpeak();

    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (sound) ctx(); // クリック時に音を有効化
    if (!animate || reduce || pool.length === 1) { finish(result); return; }
    drumroll(ROLL_MS / 1000);

    rolling = true;
    stage.classList.add("rolling");
    render();
    const start = performance.now();
    let delay = 40;
    (function tick() {
      const t = performance.now() - start;
      if (t >= ROLL_MS) { finish(result); return; }
      showNumber(pool[randInt(pool.length)]);
      delay = 40 + (t / ROLL_MS) ** 2 * 220; // だんだん遅く
      setTimeout(tick, delay);
    })();
  }

  drawBtn.addEventListener("click", draw);
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "BUTTON" && e.target !== drawBtn) return;
    if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); draw(); }
  });

  $("undoBtn").addEventListener("click", () => {
    if (!drawn.length || rolling) return;
    const last = drawn[drawn.length - 1];
    if (!confirm(`最後に出た「${last}」を取り消して、もう一度引ける状態に戻しますか？`)) return;
    drawn.pop(); save(); stopSpeak();
    drawn.length ? showNumber(drawn[drawn.length - 1]) : showNumber("スタート", true);
    $("announce").textContent = `${last}を取り消しました`;
    render();
  });

  $("resetBtn").addEventListener("click", () => {
    if (rolling) return;
    if (!confirm("これまでの結果をすべて消して、最初からやり直しますか？")) return;
    drawn = []; save(); stopSpeak();
    showNumber("スタート", true);
    $("announce").textContent = "リセットしました";
    render();
  });

  $("voiceBtn").addEventListener("click", () => {
    voiceOn = !voiceOn; save(); render();
    if (voiceOn) speak("読み上げのテストです");
    else stopSpeak();
  });
  $("soundBtn").addEventListener("click", () => { sound = !sound; save(); render(); if (sound) { const c = ctx(); if (c) snare(c.currentTime, 0.6); } });
  $("animBtn").addEventListener("click", () => { animate = !animate; save(); render(); });

  $("fsBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });

  load();
  if (drawn.length) showNumber(drawn[drawn.length - 1]);
  render();
</script>
</body>
</html>
